services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibe-chat-api:latest
    container_name: identity
    restart: unless-stopped
    # ports:
    #   - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # TypeORM dùng DB_* trực tiếp
      DB_TYPE: ${DB_TYPE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SSL: ${DB_SSL}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED}
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS}
      # Prisma yêu cầu DATABASE_URL — compose từ DB_* (TiDB Cloud cần sslaccept=strict)
      DATABASE_URL: "mysql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_DATABASE}?sslaccept=strict"
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
    networks:
      - vibe-net
      - npm_network

  # TiDB Cloud — không cần MySQL container.
  # Nếu muốn chạy MySQL local thay vì TiDB, uncomment block dưới + sửa DB_HOST=mysql trong .env
  # mysql:
  #   image: mysql:8.0
  #   container_name: vibe-mysql
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  #     MYSQL_DATABASE: ${MYSQL_DATABASE:-vibe}
  #     MYSQL_USER: ${MYSQL_USER:-vibe}
  #     MYSQL_PASSWORD: ${MYSQL_PASSWORD}
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   networks:
  #     - vibe-net

networks:
  vibe-net:
    driver: bridge
  npm_network:       # Khai báo mạng ngoài của NPM
    external: true
