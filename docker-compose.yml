version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibe-chat-api:latest
    container_name: identity
    restart: unless-stopped
    # ports:
    #   - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # TypeORM dùng DB_* trực tiếp
      DB_TYPE: ${DB_TYPE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      DB_SSL: ${DB_SSL}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED}
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS}
      # Prisma MySQL: dùng sslaccept=accept_invalid_certs để bỏ qua self-signed cert của MySQL Docker nội bộ
      DATABASE_URL: "mysql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_DATABASE}"
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MESSAGE_ENCRYPTION_KEK_BASE64: ${MESSAGE_ENCRYPTION_KEK_BASE64}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - vibe-net
      - npm_network

  mysql:
    image: mysql:8.0
    container_name: vibe-mysql
    restart: unless-stopped
    command: --skip-ssl
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE} # Đồng bộ thẳng với DB_DATABASE của app
      MYSQL_USER: ${DB_USERNAME}     # Đồng bộ thẳng với DB_USERNAME của app
      MYSQL_PASSWORD: ${DB_PASSWORD} # Đồng bộ thẳng với DB_PASSWORD của app
    ports:
      - "3306:3306" # Chỉ mở ở local IP để bảo mật, không public cổng 3306 ra ngoài internet
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibe-net

volumes:
  mysql-data:

networks:
  vibe-net:
    driver: bridge
  npm_network:       # Khai báo mạng ngoài của NPM
    external: true